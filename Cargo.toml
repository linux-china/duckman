[package]
name = "duckman"
version = "0.2.0"
edition = "2024"
authors = ["linux_china <libing.chen@gmail.com>"]
description = "duckman - a DuckDB version manager and toolchain CLI"
keywords = ["duckdb", "version-manager", "database-tools", "cli"]
categories = ["command-line-utilities"]
documentation = "https://github.com/linux-china/duckman"
readme = "README.md"
homepage = "https://github.com/linux-china/duckman"
repository = "https://github.com/linux-china/duckman"
license = "MIT"

default-run = "duckman"

[[bin]]
name = "duckman"
path = "src/main.rs"

[[bin]]
name = "duckman_shim"
path = "src/shim.rs"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
csv = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = "4.6"
clap_complete = "4.6"
colored = "3.1"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "7"
anyhow = "1"
indicatif = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
toml = { version = "1.1.8+spec-1.1.0", features = ["preserve_order"] }
toml_edit = "0.25.17+spec-1.1.0"
lazy_static = "1.5.1"
which = "8"
dotenvx-rs = "0.4.33"

[dev-dependencies]
testresult = "0.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.dev]
opt-level = 0
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = true
